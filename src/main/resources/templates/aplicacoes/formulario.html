<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aplicação de Vacina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand" href="/">🐂 CapatazTech</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/aplicacoes">Aplicações</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-primary text-white">
            <h4>Registrar Vacinação</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/aplicacoes/salvar}" th:object="${aplicacao}" method="post">
                <div class="mb-3">
                    <label class="form-label">Animal:</label>
                    <select th:field="*{animal}" class="form-select">
                        <option value="">Selecione o Animal</option>
                        <option th:each="a : ${animais}" th:value="${a.id}" th:text="'ID: ' + ${a.identificacao} + ' - ' + ${a.raca}"></option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('animal')}" th:errors="*{animal}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Vacina:</label>
                    <select th:field="*{vacina}" class="form-select">
                        <option value="">Selecione a Vacina</option>
                        <option th:each="v : ${vacinas}" th:value="${v.id}" th:text="${v.nome} + ' (' + ${v.fabricante} + ')'"></option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('vacina')}" th:errors="*{vacina}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Data da Aplicação:</label>
                    <input type="date" th:field="*{dataAplicacao}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Próxima Dose (Opcional):</label>
                    <input type="date" th:field="*{proximaDose}" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100">Salvar Aplicação</button>
                <a href="/aplicacoes" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
