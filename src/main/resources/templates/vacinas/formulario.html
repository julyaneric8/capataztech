<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vacina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand" href="/">🐂 CapatazTech</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/vacinas">Vacinas</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${vacina.id} == null ? 'Nova Vacina' : 'Editar Vacina'"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/vacinas/salvar}" th:object="${vacina}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="mb-3">
                    <label class="form-label">Nome da Vacina:</label>
                    <input type="text" th:field="*{nome}" class="form-control">
                    <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fabricante:</label>
                    <input type="text" th:field="*{fabricante}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Descrição (Opcional):</label>
                    <input type="text" th:field="*{descricao}" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">Salvar</button>
                <a href="/vacinas" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
