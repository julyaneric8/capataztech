<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vacinas - CapatazTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CapatazTech</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/animais">Animais</a>
                <a class="nav-link active" href="/vacinas">Vacinas</a>
                <a class="nav-link" href="/aplicacoes">Aplicações</a>
                <a class="nav-link" href="/vendas">Vendas</a>
                <a class="nav-link" href="/relatorios">Relatórios</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary fw-bold">Tipos de Vacinas</h2>
        <a href="/vacinas/novo" class="btn btn-primary shadow-sm">+ Nova Vacina</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Fabricante</th>
                        <th>Descrição</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="vacina : ${vacinas}">
                        <td th:text="${vacina.id}"></td>
                        <td th:text="${vacina.nome}"></td>
                        <td th:text="${vacina.fabricante}"></td>
                        <td th:text="${vacina.descricao != null ? vacina.descricao : '-'}"></td>
                        <td class="text-center">
                            <a th:href="@{/vacinas/editar/{id}(id=${vacina.id})}" class="btn btn-sm btn-warning text-white">Editar</a>
                            <a th:href="@{/vacinas/excluir/{id}(id=${vacina.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${vacinas.empty}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhuma vacina cadastrada.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
