<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vacinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand" href="/">🐂 CapatazTech</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/animais">Animais</a>
            <a class="nav-link active" href="/vacinas">Vacinas</a>
            <a class="nav-link" href="/aplicacoes">Aplicações</a>
            <a class="nav-link" href="/vendas">Vendas</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>💉 Tipos de Vacinas</h2>
        <a href="/vacinas/novo" class="btn btn-primary">+ Nova Vacina</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Nome</th><th>Fabricante</th><th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vacina : ${vacinas}">
                    <td th:text="${vacina.id}"></td>
                    <td th:text="${vacina.nome}"></td>
                    <td th:text="${vacina.fabricante}"></td>
                    <td>
                        <a th:href="@{/vacinas/editar/{id}(id=${vacina.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/vacinas/excluir/{id}(id=${vacina.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Excluir?')">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
