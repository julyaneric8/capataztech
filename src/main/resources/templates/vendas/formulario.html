<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova Venda - CapatazTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CapatazTech</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/animais">Animais</a>
                <a class="nav-link" href="/vacinas">Vacinas</a>
                <a class="nav-link" href="/aplicacoes">Aplicações</a>
                <a class="nav-link active" href="/vendas">Vendas</a>
                <a class="nav-link" href="/relatorios">Relatórios</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Registrar Nova Venda</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/vendas/salvar}" th:object="${venda}" method="post">

                <div class="mb-3">
                    <label class="form-label">Animal (Apenas Disponíveis):</label>
                    <select th:field="*{animal}" class="form-select">
                        <option value="">Selecione o animal</option>
                        <option th:each="a : ${animais}" th:value="${a.id}" th:text="'ID: ' + ${a.identificacao} + ' - ' + ${a.raca} + ' (' + ${a.peso} + 'kg)'"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('animal')}" th:errors="*{animal}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nome do Comprador:</label>
                    <input type="text" th:field="*{comprador}" class="form-control" placeholder="Nome completo">
                    <div class="text-danger small" th:if="${#fields.hasErrors('comprador')}" th:errors="*{comprador}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Valor (R$):</label>
                    <input type="number" step="0.01" th:field="*{valor}" class="form-control" placeholder="Deixe em branco para calcular pelo peso">
                    <div class="form-text text-muted">Se deixar em branco, calcularemos Peso x R$ 15,00.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Data da Venda:</label>
                    <input type="date" th:field="*{dataVenda}" class="form-control">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger">Salvar Venda</button>
                    <a href="/vendas" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
