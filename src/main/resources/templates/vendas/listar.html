<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand" href="/">🐂 CapatazTech</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/animais">Animais</a>
            <a class="nav-link" href="/vacinas">Vacinas</a>
            <a class="nav-link" href="/aplicacoes">Aplicações</a>
            <a class="nav-link active" href="/vendas">Vendas</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>💰 Histórico de Vendas</h2>
        <a href="/vendas/novo" class="btn btn-success">+ Nova Venda</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Animal</th>
                    <th>Comprador</th>
                    <th>Idade (meses)</th>
                    <th>Valor (R$)</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="venda : ${vendas}">
                    <td th:text="${venda.id}"></td>
                    <td th:text="'ID: ' + ${venda.animal.identificacao} + ' (' + ${venda.animal.raca} + ')'"></td>
                    <td th:text="${venda.comprador}"></td>
                    <td th:text="${venda.idadeMeses != null ? venda.idadeMeses : '-'}"></td>
                    <td th:text="'R$ ' + ${venda.valor}"></td>
                    <td th:text="${venda.dataVenda}"></td>
                    <td>
                        <a th:href="@{/vendas/excluir/{id}(id=${venda.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Cancelar venda?')">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
