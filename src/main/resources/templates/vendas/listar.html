<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vendas - CapatazTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CapatazTech</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/animais">Animais</a>
                <a class="nav-link" href="/vacinas">Vacinas</a>
                <a class="nav-link" href="/aplicacoes">Aplicações</a>
                <a class="nav-link active" href="/vendas">Vendas</a>
                <a class="nav-link" href="/relatorios">Relatórios</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-danger fw-bold">Histórico de Vendas</h2>
        <a href="/vendas/novo" class="btn btn-danger shadow-sm">+ Nova Venda</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Animal</th>
                        <th>Comprador</th>
                        <th>Idade (meses)</th>
                        <th>Data</th>
                        <th>Valor (R$)</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="venda : ${vendas}">
                        <td th:text="${venda.id}"></td>
                        <td th:text="'ID: ' + ${venda.animal.identificacao} + ' (' + ${venda.animal.raca} + ')'"></td>
                        <td th:text="${venda.comprador}"></td>
                        <td th:text="${venda.idadeMeses != null ? venda.idadeMeses : '-'}"></td>
                        <td th:text="${venda.dataVenda}"></td>
                        <td th:text="'R$ ' + ${venda.valor}"></td>
                        <td class="text-center">
                            <a th:href="@{/vendas/excluir/{id}(id=${venda.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja cancelar esta venda?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${vendas.empty}">
                        <td colspan="7" class="text-center text-muted py-4">Nenhuma venda registrada.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
