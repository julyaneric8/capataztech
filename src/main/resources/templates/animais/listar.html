<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animais - CapatazTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CapatazTech</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/animais">Animais</a>
                <a class="nav-link" href="/vacinas">Vacinas</a>
                <a class="nav-link" href="/aplicacoes">Aplicações</a>
                <a class="nav-link" href="/vendas">Vendas</a>
                <a class="nav-link" href="/relatorios">Relatórios</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Atenção!</strong> <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-success fw-bold">Rebanho</h2>
        <a href="/animais/novo" class="btn btn-success shadow-sm">+ Novo Animal</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Identificação</th>
                        <th>Nome</th>
                        <th>Raça</th>
                        <th>Peso</th>
                        <th>Situação</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="animal : ${animais}">
                        <td th:text="${animal.id}">1</td>
                        <td th:text="${animal.identificacao}">BR-123</td>
                        <td th:text="${animal.nome != null ? animal.nome : '-'}">Mimoso</td>
                        <td th:text="${animal.raca}">Nelore</td>
                        <td th:text="${animal.peso} + ' kg'">450 kg</td>
                        <td>
                            <span th:if="${animal.situacao == 'Disponível'}" class="badge bg-success" th:text="${animal.situacao}">Disponível</span>
                            <span th:if="${animal.situacao == 'Vendido'}" class="badge bg-danger" th:text="${animal.situacao}">Vendido</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/animais/editar/{id}(id=${animal.id})}" class="btn btn-sm btn-warning text-white">Editar</a>
                            <a th:href="@{/animais/excluir/{id}(id=${animal.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${animais.empty}">
                        <td colspan="7" class="text-center text-muted py-4">Nenhum animal cadastrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
