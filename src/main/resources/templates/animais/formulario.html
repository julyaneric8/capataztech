<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Animal - CapatazTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CapatazTech</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/animais">Animais</a>
                <a class="nav-link" href="/vacinas">Vacinas</a>
                <a class="nav-link" href="/aplicacoes">Aplicações</a>
                <a class="nav-link" href="/vendas">Vendas</a>
                <a class="nav-link" href="/relatorios">Relatórios</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0" th:text="${animal.id} == null ? 'Novo Animal' : 'Editar Animal'"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/animais/salvar}" th:object="${animal}" method="post">

                <!-- Campo oculto para o ID -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Identificação:</label>
                    <input type="text" th:field="*{identificacao}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('identificacao')}" th:errors="*{identificacao}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nome/Apelido (Opcional):</label>
                    <input type="text" th:field="*{nome}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Raça:</label>
                    <input type="text" th:field="*{raca}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('raca')}" th:errors="*{raca}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Peso (kg):</label>
                    <input type="number" step="0.1" th:field="*{peso}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Data de Nascimento:</label>
                    <input type="date" th:field="*{dataNascimento}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Situação:</label>
                    <select th:field="*{situacao}" class="form-select">
                        <option value="Disponível">Disponível</option>
                        <option value="Vendido">Vendido</option>
                    </select>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <a href="/animais" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
