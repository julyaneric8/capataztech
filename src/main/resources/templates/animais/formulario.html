<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1b5e20;">
    <div class="container">
        <a class="navbar-brand" href="/">🐂 CapatazTech</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/animais">Animais</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-success text-white">
            <h4 th:text="${animal.id} == null ? 'Novo Animal' : 'Editar Animal'"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/animais/salvar}" th:object="${animal}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Identificação (Ex: BR-123):</label>
                    <input type="text" th:field="*{identificacao}" class="form-control">
                    <div class="text-danger" th:if="${#fields.hasErrors('identificacao')}" th:errors="*{identificacao}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nome/Apelido (Opcional):</label>
                    <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Mimoso">
                </div>

                <div class="mb-3">
                    <label class="form-label">Raça:</label>
                    <input type="text" th:field="*{raca}" class="form-control">
                    <div class="text-danger" th:if="${#fields.hasErrors('raca')}" th:errors="*{raca}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Peso (kg):</label>
                    <input type="number" step="0.1" th:field="*{peso}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Data de Nascimento (Para calcular idade na venda):</label>
                    <input type="date" th:field="*{dataNascimento}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Situação:</label>
                    <select th:field="*{situacao}" class="form-select">
                        <option value="Disponível">Disponível</option>
                        <option value="Vendido">Vendido</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Salvar</button>
                <a href="/animais" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
